name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate samples
        shell: pwsh
        run: |
          if (Test-Path "samples\generate_samples.py") {
            python samples\generate_samples.py
          } else {  
            Write-Host "samples\generate_samples.py not found. Skipping sample generation."
          }

      - name: Run tests
        run: python -m unittest discover -s app\tests

      - name: Build portable app
        run: build_portable.bat

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallaces-PDFirst-portable
          path: "dist/Wallace's PDFirst"

